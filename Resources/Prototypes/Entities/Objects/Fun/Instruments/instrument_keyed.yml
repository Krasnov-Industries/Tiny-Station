- type: entity
  parent: BaseHandheldInstrument
  id: BaseKeyedInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - KeyedInstrument

- type: entity
  parent: BaseKeyedInstrument
  id: SynthesizerInstrument
  name: synthesizer
  components:
  - type: Instrument
    program: 62
  - type: SwappableInstrument
    instrumentList:
      "Electro": {62: 0} #i needed generic sounding synth presets, sue me
      "Bubbles": {63: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/h_synthesizer.rsi
  - type: StaticPrice
    price: 90

- type: entity
  parent: BaseKeyedInstrument
  id: SuperSynthesizerInstrument
  suffix: Admin
  name: super synthesizer
  description: Blasting the ghetto with Touhou MIDIs since 2020.
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: Sprite
    sprite: Objects/Fun/Instruments/h_synthesizer.rsi
    state: supersynth
  - type: Item
    heldPrefix: super

- type: entity
  parent: SuperSynthesizerInstrument
  id: SuperSynthesizerNoLimitInstrument
  suffix: NoLimits Admin
  components:
  - type: Instrument
    respectMidiLimits: false

- type: entity
  parent: BaseKeyedInstrument
  id: AccordionInstrument
  name: accordion
  components:
  - type: Instrument
    program: 21
  - type: SwappableInstrument
    instrumentList:
      "Standard": {21: 0}
      "Tango": {23: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/accordion.rsi

- type: entity
  parent: BaseKeyedInstrument
  id: KalimbaInstrument
  name: kalimba
  description: The power of a piano right at your thumbs.
  components:
  - type: Instrument
    program: 108
  - type: Sprite
    sprite: Objects/Fun/Instruments/kalimba.rsi
  - type: Item
    size: Small

- type: entity
  parent: BaseKeyedInstrument
  id: midi_player_w
  name: MIDI-плеер "Colorfly-NT"
  description: Портативный MIDI-плеер "Colorfly-NT" Услыш всю палитру звуков.
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: Sprite
    sprite: _Tinystation/Objects/midi_player_w.rsi
    state: icon
    scale: 0.5, 0.5
  - type: Item
    size: Small
    storedRotation: -90
  - type: Clothing
    quickEquip: false
    slots:
    - neck
  - type: ActivatableUI
    inHandsOnly: false