# Резисты для космических существ.

# 75% резист (coefficient 0.25 — получает 25% урона) к логичным типам.
- type: damageModifierSet
  id: SpaceLeviathan
  coefficients:
    Blunt: 0.25      # плотная плоть, хитин — палкой не пробьёшь
    Slash: 0.25      # шипастая шкура
    Piercing: 0.25   # плотная масса тела
    Heat: 0.25       # выживает в космической радиации звёзд
    Cold: 0.25       # вакуум — родная среда
    Shock: 0.25      # своя электромагнитная аура — защита
    Radiation: 0.25  # космический хищник
    # Caustic / Poison — без резиста (кислота/токсины всё ещё работают)
    # Asphyxiation — иммунитет:
    Asphyxiation: 0.0
