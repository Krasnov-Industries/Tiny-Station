# Резисты для космических существ.

# 65% резист (coefficient 0.35 — получает 35% урона) к большинству логичных типов.
- type: damageModifierSet
  id: SpaceLeviathan
  coefficients:
    Blunt: 0.35      # плотная плоть, хитин — палкой не пробьёшь
    Slash: 0.35      # шипастая шкура
    Piercing: 0.35   # плотная масса тела
    Heat: 0.35       # выживает в космической радиации звёзд
    Cold: 0.25       # вакуум — родная среда
    Shock: 0.35      # своя электромагнитная аура — защита
    Radiation: 0.35  # космический хищник
    # Caustic / Poison — без резиста (кислота/токсины всё ещё работают)
    # Asphyxiation — иммунитет:
    Asphyxiation: 0.0
