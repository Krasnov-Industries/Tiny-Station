    color: "#4a1a3a"
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 100
        reagents:
        - ReagentId: PolytrinicAcid
          Quantity: 100
  - type: InjectableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
  - type: Extractable
    grindableSolutionName: food
  - type: StaticPrice
    price: 800000

# ----------------------------------------------------------------------------
# Мозг левиафана — содержит Cognizine 100u.
# ----------------------------------------------------------------------------
- type: entity
  parent: BaseItem
