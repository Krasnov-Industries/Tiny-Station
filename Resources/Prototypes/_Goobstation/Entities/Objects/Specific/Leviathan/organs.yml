# Лут с убитого космического кита (Space Leviathan).
# Спрайты — заглушки из существующих RSI с тёмным тинтом под цвет тела кита.
# Финальные спрайты будут нарисованы отдельно.

# ----------------------------------------------------------------------------
# Ребро левиафана — простой trophy item, без реагентов.
# ----------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: LeviathanRib
  name: ребро левиафана
  description: Огромная изогнутая кость от хвостовой пластины космического кита. Тёмная, тяжёлая, до сих пор тёплая. Сама по себе — трофей.
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    state: bones
    color: "#3a1e55"
  - type: Item
    size: Normal
  - type: StaticPrice
    price: 250000

# ----------------------------------------------------------------------------
# Сердце левиафана — содержит Omnizine 100u.
# ----------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: LeviathanHeart
  name: сердце левиафана
  description: Огромный пульсирующий орган космического хищника. Внутри — концентрат жизненной силы. Извлечь шприцем или измельчить в грайндере.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: heart-on
    color: "#5a2a7a"
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 100
        reagents:
        - ReagentId: Omnizine
          Quantity: 100
  - type: InjectableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
  - type: Extractable
    grindableSolutionName: food
  - type: StaticPrice
    price: 800000

# ----------------------------------------------------------------------------
# Желудок левиафана — содержит PolytrinicAcid 100u. Осторожно.
# ----------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: LeviathanStomach
  name: желудок левиафана
  description: Мешок из плотной чёрной плоти, обтянутый венами. Внутри плещется концентрированная политриничная кислота — то, чем кит переваривает добычу заживо. Не открывайте.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: stomach
    color: "#4a1a3a"
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 100
        reagents:
        - ReagentId: PolytrinicAcid
          Quantity: 100
  - type: InjectableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
  - type: Extractable
    grindableSolutionName: food
  - type: StaticPrice
    price: 800000

# ----------------------------------------------------------------------------
# Мозг левиафана — содержит Cognizine 100u.
# ----------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: LeviathanBrain
  name: мозг левиафана
  description: Тёмная мозговая ткань с глубокими извилинами. По веществу пробегают слабые лиловые искры. Концентрат древнего разума — способен пробудить сознание в любом существе.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: brain
    color: "#4a2070"
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 100
        reagents:
        - ReagentId: Cognizine
          Quantity: 100
  - type: InjectableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
  - type: Extractable
    grindableSolutionName: food
  - type: StaticPrice
    price: 1200000
